<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ScholarClaw</title>
  <style>
    /* ========== 主题变量系统 ========== */
    :root[data-theme="dark"] {
      --bg-primary: #343541;
      --bg-sidebar: #202123;
      --bg-secondary: #2d2d2d;
      --bg-input: #40414f;
      --text-primary: #ececf1;
      --text-secondary: #8e8ea0;
      --border-color: #3a3a4a;
      --btn-primary-bg: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      --btn-hover-bg: linear-gradient(135deg, #7c5bf0 0%, #8a5fbf 100%);
      --btn-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
      --accent-color: #00d9a5;
      --accent-hover: #00f0b8;
      --danger-color: #ff4f40;
      --success-bg: #10935a;
      --message-border: #343541;
      --code-bg: #2d2d2d;
      --scrollbar-thumb: #3a3a4a;
      --scrollbar-thumb-hover: #4a4a5a;
      --history-active: #343541;
      --file-item-bg: #5436da;
      --modal-bg: #202123;
      --modal-border: #565869;
      --sidebar-border: #343541;
      --modal-input-bg: #40414f;
      --modal-input-border: #565869;
      --modal-code-bg: #2d2d2d;
      --modal-tip-bg: rgba(16,163,127,0.1);
    }
    
    :root[data-theme="light"] {
      --bg-primary: #ffffff;
      --bg-sidebar: #f7f7f8;
      --bg-secondary: #f3f4f6;
      --bg-input: #f9fafb;
      --text-primary: #1f2937;
      --text-secondary: #6b7280;
      --border-color: #e5e7eb;
      --btn-primary-bg: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      --btn-hover-bg: linear-gradient(135deg, #7c5bf0 0%, #8a5fbf 100%);
      --btn-shadow: 0 4px 12px rgba(102, 126, 234, 0.25);
      --accent-color: #00886e;
      --accent-hover: #00a382;
      --danger-color: #dc2626;
      --success-bg: #059669;
      --message-border: #f3f4f6;
      --code-bg: #f3f4f6;
      --scrollbar-thumb: #d1d5db;
      --scrollbar-thumb-hover: #9ca3af;
      --history-active: #e5e7eb;
      --file-item-bg: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      --modal-bg: #ffffff;
      --modal-border: #e5e7eb;
      --sidebar-border: #e5e7eb;
      --modal-input-bg: #f9fafb;
      --modal-input-border: #d1d5db;
      --modal-code-bg: #f3f4f6;
      --modal-tip-bg: rgba(16,163,127,0.08);
    }
    
    /* ========== 基础样式 ========== */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
      background: var(--bg-primary); 
      color: var(--text-primary); 
      transition: background-color 0.3s ease, color 0.3s ease;
    }
    
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--scrollbar-thumb-hover); }
    
    .app { display: flex; height: 100%; position: relative; }
    .theme-toggle {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--btn-primary-bg);
      border: 1px solid var(--border-color);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      box-shadow: var(--btn-shadow);
      z-index: 100;
      padding: 0;
      color: var(--text-primary);
    }
    .theme-toggle:hover {
      transform: rotate(30deg) scale(1.1);
    }
    .theme-toggle[data-theme="dark"]:hover {
      box-shadow: 0 6px 16px rgba(102, 126, 234, 0.4);
    }
    .theme-toggle[data-theme="light"]:hover {
      box-shadow: 0 6px 20px rgba(102, 126, 234, 0.3);
    }
    .theme-toggle svg {
      width: 22px;
      height: 22px;
      transition: all 0.3s ease;
    }
    .sidebar { 
      width: 260px; 
      background: var(--bg-sidebar); 
      padding: 10px; 
      display: flex; 
      flex-direction: column; 
      overflow-y: auto; 
      border-right: 1px solid var(--sidebar-border);
      transition: background-color 0.3s ease, border-color 0.3s ease;
    }
    .sidebar-header { padding: 10px; font-size: 12px; color: var(--text-secondary); margin-bottom: 10px; }
    .new-chat { 
      display: flex; 
      align-items: center; 
      gap: 10px; 
      padding: 12px; 
      background: transparent; 
      border: 1px solid var(--border-color); 
      border-radius: 5px; 
      color: var(--text-primary); 
      cursor: pointer; 
      font-size: 14px; 
      width: 100%; 
      text-align: left; 
      transition: all 0.2s ease; 
    }
    .new-chat:hover { background: var(--bg-secondary); transform: translateY(-1px); }
    .history-section { margin-top: 15px; flex: 1; overflow-y: auto; }
    .history-title { font-size: 12px; color: var(--text-secondary); padding: 8px 10px; }
    .history-item { 
      padding: 10px 12px; 
      cursor: pointer; 
      border-radius: 5px; 
      margin-bottom: 4px; 
      font-size: 13px; 
      color: var(--text-primary); 
      white-space: nowrap; 
      overflow: hidden; 
      text-overflow: ellipsis; 
      transition: all 0.2s ease; 
    }
    .history-item:hover { background: var(--bg-secondary); transform: translateY(-1px); }
    .history-item.active { background: var(--history-active); }
    .history-item .delete { float: right; opacity: 0; margin-left: 8px; color: var(--danger-color); }
    .history-item:hover .delete { opacity: 1; }
    
    .upload-section { margin-top: 10px; }
    .upload-btn { 
      display: flex; 
      align-items: center; 
      gap: 10px; 
      padding: 12px; 
      background: var(--btn-primary-bg); 
      border: none; 
      border-radius: 5px; 
      color: #ffffff; 
      cursor: pointer; 
      font-size: 14px; 
      width: 100%; 
      text-align: left; 
      transition: all 0.2s ease;
      box-shadow: var(--btn-shadow);
    }
    .upload-btn:hover { background: var(--btn-hover-bg); transform: translateY(-1px); box-shadow: 0 6px 16px rgba(102, 126, 234, 0.4); }
    .upload-btn svg { width: 20px; height: 20px; }
    .file-input { display: none; }
    .file-list { margin-top: 8px; }
    .file-item { 
      display: flex; 
      align-items: center; 
      gap: 8px; 
      padding: 6px 8px; 
      background: var(--bg-secondary); 
      border-radius: 6px; 
      margin-bottom: 4px; 
      font-size: 11px;
      transition: all 0.2s ease;
    }
    .file-item:hover { transform: translateY(-1px); }
    .file-item .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .file-item .remove { cursor: pointer; color: var(--danger-color); font-size: 12px; }
    
    .main { flex: 1; display: flex; flex-direction: column; max-width: 900px; margin: 0 auto; width: 100%; }
    .chat-container { flex: 1; overflow-y: auto; padding: 20px; }
    .message { 
      padding: 24px 0; 
      border-bottom: 1px solid var(--message-border); 
      display: flex; 
      gap: 20px;
      transition: border-color 0.3s ease;
    }
    .message.user { background: var(--bg-primary); }
    .message:last-child { border-bottom: none; }
    .avatar { width: 36px; height: 36px; min-width: 36px; min-height: 36px; border-radius: 4px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; overflow: hidden; }
    .avatar.bot { background: transparent; }
    .avatar.bot img { width: 32px !important; height: 32px !important; max-width: 32px !important; max-height: 32px !important; object-fit: contain; }
    .avatar.user { background: transparent; }
    .avatar.user img { width: 36px !important; height: 36px !important; max-width: 36px !important; max-height: 36px !important; object-fit: cover; border-radius: 4px; }
    .content { flex: 1; line-height: 1.6; white-space: pre-wrap; }
    .content h1, .content h2, .content h3 { margin: 16px 0 8px; }
    .content p { margin: 8px 0; }
    .content code { background: var(--code-bg); padding: 2px 6px; border-radius: 3px; font-family: 'SF Mono', Monaco, monospace; font-size: 0.9em; }
    .content pre { background: var(--code-bg); padding: 16px; border-radius: 6px; overflow-x: auto; margin: 12px 0; }
    .content pre code { background: transparent; padding: 0; }
    .content ul, .content ol { margin: 8px 0; padding-left: 24px; }
    .content li { margin: 4px 0; }
    .content strong { font-weight: 600; }
    .input-container { 
      padding: 20px; 
      background: var(--bg-primary); 
      transition: background-color 0.3s ease;
    }
    .input-wrapper { max-width: 800px; margin: 0 auto; position: relative; }
    .chat-input { 
      width: 100%; 
      padding: 16px; 
      padding-right: 50px; 
      background: var(--bg-input); 
      border: 1px solid var(--border-color); 
      border-radius: 12px; 
      color: var(--text-primary); 
      font-size: 16px; 
      font-family: inherit; 
      resize: none; 
      min-height: 56px; 
      max-height: 200px; 
      outline: none;
      transition: all 0.2s ease;
    }
    .chat-input:focus { 
      box-shadow: 0 0 0 2px rgba(102, 126, 234, 0.5); 
      border-color: transparent;
    }
    .chat-input::placeholder { color: var(--text-secondary); }
    .send-btn { 
      position: absolute; 
      right: 12px; 
      bottom: 12px; 
      background: var(--btn-primary-bg); 
      border: none; 
      border-radius: 6px; 
      width: 32px; 
      height: 32px; 
      cursor: pointer; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      transition: all 0.2s ease;
      box-shadow: var(--btn-shadow);
    }
    .send-btn:hover { background: var(--btn-hover-bg); transform: translateY(-1px); box-shadow: 0 6px 16px rgba(102, 126, 234, 0.4); }
    .send-btn:disabled { background: var(--border-color); cursor: not-allowed; box-shadow: none; transform: none; }
    .send-btn svg { width: 18px; height: 18px; fill: white; }
    .typing { display: inline-flex; gap: 4px; padding: 12px 16px; background: var(--bg-input); border-radius: 12px; }
    .typing span { width: 8px; height: 8px; background: var(--text-secondary); border-radius: 50%; animation: bounce 1.4s infinite ease-in-out; }
    .typing span:nth-child(1) { animation-delay: -0.32s; }
    .typing span:nth-child(2) { animation-delay: -0.16s; }
    @keyframes bounce { 0%, 80%, 100% { transform: scale(0.6); opacity: 0.5; } 40% { transform: scale(1); opacity: 1; } }
    
    .model-badge { 
      position: absolute; 
      top: -30px; 
      right: 0; 
      font-size: 12px; 
      color: var(--text-secondary); 
      background: var(--bg-secondary); 
      padding: 4px 8px; 
      border-radius: 4px;
      transition: all 0.3s ease;
    }
    .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: var(--text-secondary); text-align: center; padding: 40px; }
    .empty-state h1 { font-size: 24px; margin-bottom: 20px; color: var(--text-primary); }
    .empty-state p { font-size: 14px; max-width: 400px; }
    .lit-section { margin-top: 10px; padding: 10px; background: var(--bg-secondary); border-radius: 8px; transition: background-color 0.3s ease; }
    .lit-title { font-size: 12px; color: var(--text-secondary); margin-bottom: 8px; }
    .lit-btn { 
      display: block; 
      width: 100%; 
      padding: 8px; 
      margin-bottom: 6px; 
      background: var(--btn-primary-bg); 
      border: none; 
      border-radius: 4px; 
      color: white; 
      font-size: 12px; 
      cursor: pointer; 
      text-align: center;
      transition: all 0.2s ease;
      box-shadow: 0 2px 8px rgba(102, 126, 234, 0.2);
    }
    .lit-btn:hover { background: var(--btn-hover-bg); transform: translateY(-1px); box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3); }
    .lit-info { font-size: 11px; color: var(--text-secondary); line-height: 1.4; }
    .settings-section { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--sidebar-border); }
    .settings-section .lit-btn { background: transparent; border: 1px solid var(--border-color); color: var(--text-primary); box-shadow: none; }
    .settings-section .lit-btn:hover { background: var(--bg-secondary); transform: translateY(-1px); border-color: var(--btn-hover-bg); }
    
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); z-index: 1000; align-items: center; justify-content: center; }
    .modal-overlay.show { display: flex; }
    .modal { 
      background: var(--modal-bg); 
      border-radius: 12px; 
      padding: 24px; 
      max-width: 400px; 
      width: 90%;
      border: 1px solid var(--modal-border);
      transition: all 0.3s ease;
    }
    .modal h3 { margin-bottom: 16px; color: var(--text-primary); }
    .modal input, .modal select { 
      width: 100%; 
      padding: 10px; 
      margin-bottom: 12px; 
      background: var(--bg-input); 
      border: 1px solid var(--modal-border); 
      border-radius: 6px; 
      color: var(--text-primary);
      transition: all 0.2s ease;
    }
    .modal input:focus, .modal select:focus { 
      outline: none; 
      border-color: #667eea; 
      box-shadow: 0 0 0 2px rgba(102, 126, 234, 0.2);
    }
    .modal .btns { display: flex; gap: 10px; }
    .modal .btns button { flex: 1; padding: 10px; border: none; border-radius: 6px; cursor: pointer; transition: all 0.2s ease; }
    .modal .btns .ok { background: var(--btn-primary-bg); color: white; box-shadow: var(--btn-shadow); }
    .modal .btns .ok:hover { background: var(--btn-hover-bg); transform: translateY(-1px); }
    .modal .btns .cancel { background: var(--bg-secondary); color: var(--text-primary); }
    .modal .btns .cancel:hover { background: var(--border-color); transform: translateY(-1px); }
    .current-api { font-size: 11px; color: var(--text-secondary); margin-bottom: 8px; }
  </style>
</head>
<body>
  <div class="modal-overlay" id="modalOverlay" onclick="closeModal()">
    <div class="modal" onclick="event.stopPropagation()">
      <h3 id="modalTitle">设置</h3>
      <div id="modalContent"></div>
    </div>
  </div>
  
  <div class="app">
    <button class="theme-toggle" onclick="toggleTheme()" title="切换主题">
      <svg id="themeIcon" viewBox="0 0 24 24">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </svg>
    </button>
    
    <div class="sidebar">
      <div class="sidebar-header">SCHOLARCLOW</div>
      <button class="new-chat" onclick="newChat()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        New Chat
      </button>
      
      <div class="upload-section">
        <input type="file" id="fileInput" class="file-input" accept=".txt,.md,.json,.ris,.bib,.pdf" multiple>
        <button class="upload-btn" onclick="document.getElementById('fileInput').click()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="17 8 12 3 7 8"></polyline>
            <line x1="12" y1="3" x2="12" y2="15"></line>
          </svg>
          上传文献摘要
        </button>
        <div class="file-list" id="fileList"></div>
      </div>
      
      <div class="history-section">
        <div class="history-title">History</div>
        <div id="historyList"></div>
      </div>
      
      <div class="settings-section">
        <button class="lit-btn" onclick="showDraftDialog()">📝 论文草稿</button>
        <button class="lit-btn" onclick="showExperimentSummary()">🧪 实验资料总结</button>
        <button class="lit-btn" onclick="showDataSummary()">📊 数据详细总结</button>
        <button class="lit-btn" onclick="showConnectDialog()">⚙️ API 设置</button>
        <button class="lit-btn" onclick="showEmbeddingDialog()">🔤 Embedding API 配置</button>
        <button class="lit-btn" onclick="showModelDialog()">🤖 切换模型</button>
        <button class="lit-btn" onclick="showWebSearchDialog()">🌐 联网搜索配置</button>
        <button class="lit-btn" onclick="showFeishuDialog()">🤖 飞书机器人配置</button>
        <button class="lit-btn" onclick="showJournalStyleDialog()">📰 分析目标期刊风格</button>
        <button class="lit-btn niceaigc-btn" onclick="showNiceAIGCDialog()">🔄 NiceAIGC 配置</button>
      </div>
    </div>
    
    <div class="main">
      <div class="chat-container" id="chatContainer">
        <div class="empty-state" id="emptyState">
          <h1>ScholarClaw</h1>
          <p>你好！我是学术论文写作助手。</p>
          <p style="margin-top: 12px;">正在加载您的文献库...</p>
        </div>
        <div id="messages"></div>
      </div>
      <div class="input-container">
        <div class="input-wrapper">
          <div class="model-badge" id="modelBadge">MODEL</div>
          <textarea class="chat-input" id="userInput" placeholder="Send a message..." rows="1" autocomplete="off"></textarea>
          <button class="send-btn" id="sendBtn" onclick="sendMessage()">
            <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
          </button>
        </div>
      </div>
    </div>
  </div>
  <script>
    var STORAGE_KEY = 'scholarclaw_history';
    var MSG_KEY = 'scholarclaw_msgs_';
    var LIT_KEY = 'scholarclaw_lit_';
    var API_KEY = 'scholarclaw_api';
    var MODEL_KEY = 'scholarclaw_model';
    var USER_ID_KEY = 'scholarclaw_userid';
    var WEB_SEARCH_KEY = 'scholarclaw_websearch';
    var EMBEDDING_KEY = 'scholarclaw_embedding';
    var THEME_KEY = 'scholarclaw_theme';
    var NICEAIGC_KEY = 'scholarclaw_niceaigc';
    var niceAIGCConfig = { enabled: false, chatUrl: 'https://niceaigc.com/chat', useForChat: false };
    
    // ========== 主题管理功能 ==========
    var THEME_ICONS = {
      // 月亮图标 - 线条轮廓样式
      dark: '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>',
      // 太阳图标 - 圆形核心 + 8 条光线（线条轮廓样式）
      light: '<circle cx="12" cy="12" r="5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="12" y1="1" x2="12" y2="3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="12" y1="21" x2="12" y2="23" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="1" y1="12" x2="3" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="21" y1="12" x2="23" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>'
    };
    
    function updateThemeIcon(theme) {
      var iconEl = document.getElementById('themeIcon');
      var toggleBtn = document.querySelector('.theme-toggle');
      if (iconEl) {
        iconEl.innerHTML = THEME_ICONS[theme];
      }
      if (toggleBtn) {
        toggleBtn.setAttribute('data-theme', theme);
      }
    }
    
    function initTheme() {
      var savedTheme = localStorage.getItem(THEME_KEY);
      var systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      var theme = savedTheme || (systemPrefersDark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
      updateThemeIcon(theme);
    }
    
    function toggleTheme() {
      var currentTheme = document.documentElement.getAttribute('data-theme');
      var newTheme = currentTheme === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', newTheme);
      localStorage.setItem(THEME_KEY, newTheme);
      updateThemeIcon(newTheme);
    }
    
    // 初始化主题
    initTheme();
    
    function getUserId() {
      // 始终使用 web-user 作为用户 ID，确保记忆共享
      // 不在 New Chat 时创建新用户 ID
      var id = localStorage.getItem(USER_ID_KEY);
      // 如果 id 不存在或者是 chat- 开头（旧格式），强制使用 web-user
      if (!id || id.indexOf('chat-') === 0) {
        id = 'web-user';
        localStorage.setItem(USER_ID_KEY, id);
        console.log('[getUserId] 创建/重置默认用户 ID:', id);
      } else {
        console.log('[getUserId] 使用已有用户 ID:', id);
      }
      return id;
    }
    var currentUserId = getUserId();
    var currentConversationId = null;
    var uploadedFiles = [];
    var apiConfig = { url: '', key: '', model: '' };
    var currentModel = 'qwen3.5-plus';
    var chatContainer = document.getElementById('chatContainer');
    var messagesDiv = document.getElementById('messages');
    var userInput = document.getElementById('userInput');
    var sendBtn = document.getElementById('sendBtn');
    var emptyState = document.getElementById('emptyState');
    var modelBadge = document.getElementById('modelBadge');
    var fileList = document.getElementById('fileList');
    var historyList = document.getElementById('historyList');
    var litInfo = document.getElementById('litInfo');
    
    // 保存草稿到服务器
    async function saveDraftToServer(latexContent, section) {
      try {
        var response = await fetch('/api/draft/' + currentUserId, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            content: latexContent,
            section: section,
            append: true
          })
        });
        
        var result = await response.json();

      if (saveBtn) {

        saveBtn.textContent = '保存中...';
        saveBtn.style.opacity = '0.7';
      }
      
      // 恢复按钮的辅助函数
      function restoreBtn() {
        if (saveBtn) {
          saveBtn.disabled = false;
          saveBtn.textContent = '保存';
          saveBtn.style.opacity = '1';
        }
      }
      
      fetch('/api/feishu/config', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ appId: appId, appSecret: appSecret })
      })
      .then(function(r) { 
        if (!r.ok) {

      if (embeddingConfig.model) formData.append('embeddingModel', embeddingConfig.model);

      try {
        var response = await fetch('/api/upload', {
          method: 'POST',
          body: formData
        });
        
        var data = await response.json();
        
        document.querySelector('.message.bot:last-child').remove();
        
        if (data.success) {
          uploadedFiles = [{ name: '文献库', content: data.summary.count + '个文件' }];

    async function sendMessage() {
      var message = userInput.value.trim();
      if (!message && uploadedFiles.length === 0) return;
      
      if (message === '/connect') {
        userInput.value = '';
        showConnectDialog();
        return;
      }
      
      if (message === '/model') {
        userInput.value = '';
        showModelDialog();
        return;
      }

      emptyState.style.display = 'none';
      userInput.disabled = true;
      sendBtn.disabled = true;

      appendMessage(message || '[已上传文献]', 'user', false);
      userInput.value = '';
      autoResize();

      addTyping();

      // 确保有 conversationId
      if (!currentConversationId) {
        currentConversationId = 'conv-' + Date.now();
      }

      // 使用复合 key 读取消息
      var storageKey = MSG_KEY + currentUserId + '_' + currentConversationId;
      var savedMsgs = localStorage.getItem(storageKey) 
        ? JSON.parse(localStorage.getItem(storageKey)) 
        : [];
      
      // 添加当前消息
      savedMsgs.push({ role: 'user', content: message, isHtml: false, timestamp: Date.now() });
      
      try {
        var historyMsgs = savedMsgs.slice(-10);
        
        // Check if NiceAIGC is enabled - if so, use it by default
        if (niceAIGCConfig.enabled) {
          appendMessage('[系统] 正在通过 NiceAIGC 处理...', 'bot', false);
          
          // 准备 NiceAIGC 所需的完整上下文（和 API Flow 一样的内容）
          var niceaigcContext = await prepareNiceAIGCContext(message);
          
          var niceaigcResponse = await fetch('/api/niceaigc/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              message: message,
              userId: currentUserId,
              conversationId: currentConversationId,
              // 完整的上下文信息（不含历史对话，NiceAIGC自己保存）
              context: niceaigcContext
            })
          });
          
          var niceaigcData = await niceaigcResponse.json();
          
          // Safely remove typing indicator
          var typingEl = document.querySelector('.typing');
          if (typingEl && typingEl.parentNode) {
            typingEl.parentNode.removeChild(typingEl);
          }
          
          userInput.disabled = false;
          sendBtn.disabled = false;
          userInput.focus();
          
          if (niceaigcData.success) {
            appendMessage(niceaigcData.response, 'bot', true);
            savedMsgs.push({ role: 'assistant', content: niceaigcData.response, isHtml: true, timestamp: Date.now() });
            localStorage.setItem(storageKey, JSON.stringify(savedMsgs));
            
            // 调用 API Flow 处理记忆更新（手脚层）
            try {
              await updateMemoryWithAPI(message, niceaigcData.response, currentUserId);
            } catch (e) {
              console.warn('Memory update failed:', e);
            }
          } else {
            appendMessage('❌ NiceAIGC 错误: ' + (niceaigcData.error || '未知错误'), 'bot', false);
          }
          
          renderHistory();
          return;
        }
        
        var formData = new FormData();
        formData.append('userId', currentUserId);
        formData.append('conversationId', currentConversationId);
        formData.append('message', message);
        formData.append('history', JSON.stringify(historyMsgs));
        formData.append('apiUrl', apiConfig.url);
        formData.append('apiKey', apiConfig.key);
        formData.append('model', currentModel);
        
        // 添加 Agent 配置
        var agentConfig = localStorage.getItem('scholarclaw_agent_config');
        if (agentConfig) {
          formData.append('agentConfig', agentConfig);
        }
        
        var webConfig = getWebSearchConfig();
        if (webConfig.url) formData.append('webSearchUrl', webConfig.url);
        if (webConfig.key) formData.append('webSearchKey', webConfig.key);

        // 添加 Embedding 配置
        var embeddingConfig = getEmbeddingConfig();
        if (embeddingConfig.url) formData.append('embeddingUrl', embeddingConfig.url);
        if (embeddingConfig.key) formData.append('embeddingKey', embeddingConfig.key);
        if (embeddingConfig.model) formData.append('embeddingModel', embeddingConfig.model);
        formData.append('embeddingEnabled', embeddingConfig.enabled ? 'true' : 'false');

        var response = await fetch('/api/chat', {
          method: 'POST',
          body: formData
        });

        var data = await response.json();
        
        // Safely remove typing indicator
        var typingEl = document.querySelector('.typing');
        if (typingEl && typingEl.parentNode) {
          typingEl.parentNode.removeChild(typingEl);
        }
        
        userInput.disabled = false;
        sendBtn.disabled = false;
        userInput.focus();
        
        if (data.error) {
          appendMessage('❌ ' + data.error, 'bot', false);
        } else if (data.response) {
          appendMessage(data.response, 'bot', true);
          
          // 检查 AI 响应中是否包含草稿保存指令
          // 匹配格式：🔧 调用工具：save_draft\ncontent: |\n[内容]\nsection: [章节名]
          var draftMatch = data.response.match(/🔧\s*调用工具[:：]\s*save_draft\s*\ncontent[:：]\s*\|?\s*\n?([\s\S]*?)\nsection[:：]\s*([a-z_]+)/i);
          if (!draftMatch) {
            // 尝试匹配没有 | 符号的格式
            draftMatch = data.response.match(/🔧\s*调用工具[:：]\s*save_draft\s*\ncontent[:：]\s*([\s\S]*?)\nsection[:：]\s*([a-z_]+)/i);
          }
          if (draftMatch) {
            var latexContent = draftMatch[1].trim();
            var section = draftMatch[2].trim();
            console.log('[Draft] Matched section:', section, 'Content length:', latexContent.length);
            saveDraftToServer(latexContent, section);
          } else {
            console.log('[Draft] No draft match found in response');
          }
          
          // 保存 AI 回复
          savedMsgs.push({ role: 'assistant', content: data.response, isHtml: true, timestamp: Date.now() });
          localStorage.setItem(storageKey, JSON.stringify(savedMsgs));
          
          // 保存到历史记录
          if (savedMsgs.length >= 2) {
            var firstUserMsg = savedMsgs.find(function(m) { return m.role === 'user'; });
            var title = firstUserMsg ? (firstUserMsg.content || '').slice(0, 25) + ((firstUserMsg.content || '').length > 25 ? '...' : '') : '新对话';
            
            var history = getHistory();
            var existingIndex = history.findIndex(function(h) { return h.id === currentConversationId; });
            
            if (existingIndex >= 0) {
              history[existingIndex].title = title;
            } else {
              history.unshift({ id: currentConversationId, title: title });
            }
            if (history.length > 30) history = history.slice(0, 30);
            saveHistory(history);
            renderHistory();
          }
        }
        
        uploadedFiles = [];
        renderFileList();
      } catch (error) {
        // Safely remove typing indicator on error
        var typingEl2 = document.querySelector('.typing');
        if (typingEl2 && typingEl2.parentNode) {
          typingEl2.parentNode.removeChild(typingEl2);
        }
        appendMessage('Error: ' + error.message, 'bot', false);
      }

      userInput.disabled = false;
      sendBtn.disabled = false;
      userInput.focus();
      renderHistory();
    }

    function formatMessage(text) {
      // 转义HTML特殊字符
      text = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      
      // 处理代码块（必须在其他处理之前）
      text = text.replace(/```(\w*)\n([\s\S]*?)```/g, '<pre style="background:#f6f8fa;border-radius:6px;padding:16px;overflow-x:auto;margin:12px 0;font-family:monospace;font-size:14px;line-height:1.5;"><code style="background:none;padding:0;">$2</code></pre>');
      
      // 处理行内代码
      text = text.replace(/`([^`]+)`/g, '<code style="background:#f6f8fa;padding:2px 6px;border-radius:3px;font-family:monospace;font-size:14px;color:#e83e8c;">$1</code>');
      
      // 处理标题（h1-h6）
      text = text.replace(/^###### (.+)$/gm, '<h6 style="font-size:14px;color:#666;margin:16px 0 8px 0;font-weight:600;">$1</h6>');
      text = text.replace(/^##### (.+)$/gm, '<h5 style="font-size:15px;color:#555;margin:16px 0 8px 0;font-weight:600;">$1</h5>');
      text = text.replace(/^#### (.+)$/gm, '<h4 style="font-size:16px;color:#444;margin:16px 0 8px 0;font-weight:600;">$1</h4>');
      text = text.replace(/^### (.+)$/gm, '<h3 style="font-size:18px;color:#333;margin:20px 0 10px 0;font-weight:600;border-bottom:2px solid #10a37f;padding-bottom:6px;">$1</h3>');
      text = text.replace(/^## (.+)$/gm, '<h2 style="font-size:20px;color:#222;margin:24px 0 12px 0;font-weight:600;border-bottom:2px solid #10a37f;padding-bottom:8px;">$1</h2>');
      text = text.replace(/^# (.+)$/gm, '<h1 style="font-size:24px;color:#111;margin:28px 0 16px 0;font-weight:700;border-bottom:3px solid #10a37f;padding-bottom:10px;">$1</h1>');
      
      // 处理引用块
      text = text.replace(/^&gt; (.+)$/gm, '<blockquote style="border-left:4px solid #10a37f;margin:12px 0;padding:12px 16px;background:#f8f9fa;color:#555;font-style:italic;border-radius:0 6px 6px 0;">$1</blockquote>');
      
      // 处理无序列表
      text = text.replace(/^(\s*)[-\*] (.+)$/gm, function(match, indent, content) {
        var level = indent.length / 2;
        var padding = 24 + (level * 20);
        return '<div style="margin:6px 0;padding-left:' + padding + 'px;position:relative;"><span style="position:absolute;left:' + (padding - 16) + 'px;color:#10a37f;font-weight:bold;">•</span>' + content + '</div>';
      });
      
      // 处理有序列表
      var olCounter = {};
      text = text.replace(/^(\s*)(\d+)\. (.+)$/gm, function(match, indent, num, content) {
        var level = indent.length / 2;
        var key = level;
        if (!olCounter[key]) olCounter[key] = 0;
        olCounter[key]++;
        var padding = 24 + (level * 20);
        return '<div style="margin:6px 0;padding-left:' + padding + 'px;position:relative;"><span style="position:absolute;left:' + (padding - 20) + 'px;color:#10a37f;font-weight:600;">' + olCounter[key] + '.</span>' + content + '</div>';
      });
      
      // 处理分隔线
      text = text.replace(/^---+$/gm, '<hr style="border:none;border-top:2px solid #e1e4e8;margin:24px 0;">');
      text = text.replace(/^\*\*\*+$/gm, '<hr style="border:none;border-top:2px solid #e1e4e8;margin:24px 0;">');
      
      // 处理表格（简化版）
      text = text.replace(/\|(.+)\|/g, function(match, content) {
        var cells = content.split('|').map(function(cell) {
          return '<td style="border:1px solid #ddd;padding:8px 12px;">' + cell.trim() + '</td>';
        }).join('');
        return '<tr>' + cells + '</tr>';
      });
      
      // 处理带引用标记的句子（绿色背景）
      text = text.replace(/(\[S\d+\][^\n]*?)✓/g, '<div style="background:rgba(16,163,127,0.15);border-left:3px solid #10a37f;padding:8px 12px;margin:4px 0;border-radius:4px;">$1<span style="color:#10a37f;font-weight:bold;"> ✓</span></div>');
      
      // 处理带检索标记的句子（黄色背景）
      text = text.replace(/(\[S\d+\][^\n]*?)(⚠️|\[需检索:[^\]]+\])/g, '<div style="background:rgba(255,193,7,0.15);border-left:3px solid #ffc107;padding:8px 12px;margin:4px 0;border-radius:4px;">$1<span style="color:#ffc107;font-weight:bold;"> ⚠️</span></div>');
      
      // 处理粗体
      text = text.replace(/\*\*([^*]+)\*\*/g, '<strong style="font-weight:600;color:#111;">$1</strong>');
      
      // 处理斜体
      text = text.replace(/\*([^*]+)\*/g, '<em style="font-style:italic;color:#555;">$1</em>');
      
      // 处理删除线
      text = text.replace(/~~(.+?)~~/g, '<del style="text-decoration:line-through;color:#999;">$1</del>');
      
      // 处理链接
      text = text.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" style="color:#10a37f;text-decoration:none;border-bottom:1px solid #10a37f;">$1</a>');
      
      // 处理换行（保留段落间的空行）
      text = text.replace(/\n\n+/g, '</p><p style="margin:12px 0;line-height:1.7;">');
      text = text.replace(/\n/g, '<br>');
      
      // 包装在段落中
      if (!text.startsWith('<h') && !text.startsWith('<pre') && !text.startsWith('<blockquote') && !text.startsWith('<div')) {
        text = '<p style="margin:12px 0;line-height:1.7;">' + text + '</p>';
      }
      
      return text;
    }

    /**
     * 准备 NiceAIGC 上下文（和 API Flow 完全一致）
     */
    async function prepareNiceAIGCContext(message) {
      var context = {
        // 1. 系统提示词
        systemPrompt: buildSystemPrompt(),
        // 2. 用户自定义灵魂
        soulContent: null,
        // 3. 写作任务类型
        taskType: detectTaskType(message),
        // 4. 用户记忆
        memory: {},
        // 5. 写作技能
        writingSkill: loadWritingSkill(message),
        // 6. 文献上下文
        literature: null,
        // 7. 期刊风格
        journalStyle: null,
        // 8. 联网搜索（如需要）
        webSearchContext: null
      };
      
      // 从 localStorage 读取用户自定义灵魂
      var soulData = localStorage.getItem('scholarclaw_soul');
      if (soulData) {
        try {
          context.soulContent = JSON.parse(soulData).content;
        } catch (e) {}
      }
      
      // 从服务器读取用户记忆（跨会话长期记忆）
      try {
        var memoryResponse = await fetch('/api/memory/' + currentUserId);
        if (memoryResponse.ok) {
          var memoryResult = await memoryResponse.json();
          if (memoryResult.success && memoryResult.memory) {
            var memory = memoryResult.memory;
            context.memory = {
              writingProgress: memory.entries?.find(e => e.key === 'writing_progress')?.value,
              completedChapters: memory.entries?.find(e => e.key === 'completed_chapters')?.value,
              pendingChapters: memory.entries?.find(e => e.key === 'pending_chapters')?.value,
              conversations: memory.conversations?.slice(-5),
              other: memory.entries?.filter(e => 
                !['writing_progress', 'completed_chapters', 'pending_chapters'].includes(e.key)
              ).slice(-8)
            };
          }
        }
      } catch (e) {
        console.warn('Failed to load memory from server:', e);
      }
      
      // 从 localStorage 读取期刊风格
      var journalData = localStorage.getItem('scholarclaw_journal_' + currentUserId);
      if (journalData) {
        try {
          context.journalStyle = JSON.parse(journalData);
        } catch (e) {
          console.warn('Failed to load journal style:', e);
        }
      }
      
      // 从服务器获取文献信息
      try {
        var litResponse = await fetch('/api/literature?userId=' + currentUserId);
        if (litResponse.ok) {
          var litData = await litResponse.json();
          if (litData.success) {
            context.literature = {
              count: litData.papers?.length || 0,
              summary: litData.summary,
              recent: litData.papers?.slice(0, 10).map(p => ({
                title: p.title,
                authors: p.authors,
                year: p.year,
                journal: p.journal,
                abstract: p.abstract?.substring(0, 300)
              }))
            };
          }
        }
      } catch (e) {
        console.warn('Failed to load literature:', e);
      }
      
      return context;
    }
    
    /**
     * 检测任务类型（和 API Flow 一致）
     */
    function detectTaskType(message) {
      var lowerMsg = message.toLowerCase();
      if (lowerMsg.includes('引言') || lowerMsg.includes('intro')) {
        return '用户想要写 Introduction（引言）部分。请使用【代码自动检索的参考文献】中提供的引用格式撰写内容。';
      }
      if (lowerMsg.includes('讨论') || lowerMsg.includes('discussion')) {
        return '用户想要写 Discussion（讨论）部分。';
      }
      if (lowerMsg.includes('方法') || lowerMsg.includes('method')) {
        return '用户想要写 Methods（方法）部分。';
      }
      if (lowerMsg.includes('结果') || lowerMsg.includes('result')) {
        return '用户想要写 Results（结果）部分。';
      }
      return '用户提出问题，请基于已有文献和知识回答。';
    }
    
    /**
     * 加载写作技能（简化版，与 API Flow 一致）
     */
    function loadWritingSkill(message) {
      var lowerMsg = message.toLowerCase();
      var skillMap = {
        'introduction': { chapter: 'Introduction', file: '03_introduction_skill.md' },
        'intro': { chapter: 'Introduction', file: '03_introduction_skill.md' },
        'methods': { chapter: 'Methods', file: '04_methods_skill.md' },
        'method': { chapter: 'Methods', file: '04_methods_skill.md' },
        'results': { chapter: 'Results', file: '05_results_skill.md' },
        'result': { chapter: 'Results', file: '05_results_skill.md' },
        'discussion': { chapter: 'Discussion', file: '07_discussion_skill.md' },
        'conclusion': { chapter: 'Conclusion', file: '08_conclusion_skill.md' },
        'abstract': { chapter: 'Abstract', file: '02_abstract_skill.md' },
        'title': { chapter: 'Title', file: '01_title_skill.md' }
      };
      
      for (var key in skillMap) {
        if (lowerMsg.includes(key)) {
          return {
            chapter: skillMap[key].chapter,
            file: skillMap[key].file
          };
        }
      }
      return null;
    }

## 🎯 核心职责
1. **学术写作指导**：提供专业的学术写作建议，确保内容符合学术规范
2. **文献整合**：基于提供的文献库，准确引用已有研究
3. **结构规划**：帮助用户构建清晰的论文框架和逻辑流程
4. **语言润色**：提供学术英语表达建议，确保语言严谨流畅

## 🧠 你的能力
1. **文献库搜索**：使用系统提供的【代码自动检索的参考文献】
2. **联网搜索**：可以搜索互联网最新研究（仅用于背景信息，**不能用于参考文献**）
3. **写作进度追踪**：系统记录用户的写作进度，可以 continuation 未完成的章节
4. **跨会话记忆**：系统会保存用户的历史信息，包括研究主题、目标期刊、写作进度等

## ⚠️ 重要：代码控制参考文献

### 系统已自动完成
- 代码已从您的文献库中检索出最相关的文献
- 每篇文献的完整信息（标题、作者、年份、期刊、DOI、摘要）已提供
- 标准化的引用格式已生成

### 你的任务（严格遵循）
1. **阅读【代码自动检索的参考文献】部分**
2. **使用提供的引用格式**（如：(Wang et al., 2023)）
3. **复制粘贴，严禁修改**：
   - 不要修改作者姓名
   - 不要修改年份
   - 不要修改标题
   - 不要编造文献中不存在的细节

### 绝对禁止
❌ **严禁以下行为**：
- 编造不存在的文献
- 修改代码提供的引用格式
- 从摘要中编造原文不存在的细节
- 使用网络搜索结果作为参考文献

✅ **唯一正确的做法**：
- 从【代码自动检索的参考文献】列表中选择合适的文献
- 复制代码提供的引用格式到正文中
- 基于提供的摘要撰写内容，但不编造细节

## 📝 写作风格要求
1. **学术严谨**：使用正式的学术语言，避免口语化表达
2. **逻辑清晰**：段落之间要有清晰的逻辑连接
3. **客观中立**：使用适当的模糊限制词（hedging），如 "suggests", "indicates", "may" 等
4. **时态规范**：
   - 引言：一般现在时（描述已知事实）+ 现在完成时（描述研究进展）
   - 方法：一般过去时
   - 结果：一般过去时
   - 讨论：一般现在时（解释结果）+ 一般过去时（引用本研究）

## 🎯 渐进式写作流程
**绝对不要一次性生成整个章节！** 必须采用渐进式：

1. **先询问写作重点**
   - "好的，我来帮你写引言。请问你想在引言中重点阐述什么？"
   - 引导用户说明：研究背景、研究缺口、研究问题、创新点

2. **建议章节结构，等用户确认**
   - "根据你的研究，建议引言包括 3 段：①研究背景 ②研究缺口 ③研究目标"
   - "你觉得这个结构可以吗？需要调整吗？"

3. **分段写作，逐段确认**
   - 一次只写 1 个段落
   - 写完后问："第 1 段写好了，你看这样可以吗？需要调整什么吗？"
   - **等用户确认后再写下一段**

4. **记住：用户是研究专家，你是写作助手。不要替用户做决定。**

## 📚 文献引用规范
1. **引用格式**：使用 "(作者, 年份)" 格式，如 "(Wang et al., 2023)"
2. **引用位置**：在论述的句末或从句末尾
3. **多重引用**：按时间顺序排列，如 "(Smith, 2020; Wang et al., 2023)"
4. **直接引用**：如果直接引用原文，需加引号并注明页码

## 🔄 与用户的协作方式
1. **询问而非假设**：不确定时要问用户，不要自己猜测
2. **提供选项**：给用户多个选择，让用户决定
3. **接受反馈**：用户提出修改意见时，积极调整
4. **解释原因**：说明为什么这么写，帮助用户理解学术写作逻辑

## 📝 论文草稿功能
当用户说"保存到草稿"、"更新到草稿"时，你必须在回复最后包含以下格式的触发指令：

content: |
[LaTeX格式的内容，可以包含多行]
section: [章节名，如 introduction, methods, results, discussion, conclusion, abstract]
\`\`\`

**示例**：
\`\`\`
🔧 调用工具：save_draft
content: |
\\section{Introduction}
Climate change has become one of the most pressing challenges facing global agriculture (Smith et al., 2023).
section: introduction
\`\`\`

**要求**：
1. 只要用户请求保存到草稿，就必须包含上述触发指令
2. content 后面使用 | 符号表示多行内容
3. section 必须是英文小写章节名
4. 保存后告知用户已保存到哪个章节`;

    function loadNiceAIGCConfig() {

      } else {

      updateNiceAIGCButton();
    }
    
    function updateNiceAIGCButton() {
      var btn = document.querySelector('.niceaigc-btn');

        if (niceAIGCConfig.enabled) {

    async function testNiceAIGCConnection() {
      var resultDiv = document.getElementById('niceaigcTestResult');
      resultDiv.style.display = 'block';
      resultDiv.style.background = 'rgba(255,193,7,0.15)';
      resultDiv.innerHTML = '正在测试连接...';
      
      try {
        var response = await fetch('/api/niceaigc/test');
        var data = await response.json();
        
        if (data.success) {
          resultDiv.style.background = 'rgba(16,163,127,0.15)';
          resultDiv.innerHTML = '✅ ' + data.message;
          document.getElementById('niceaigcUseBtn').style.display = 'block';
        } else {
          resultDiv.style.background = 'rgba(220,38,38,0.15)';
          resultDiv.innerHTML = '❌ ' + (data.message || data.error || '连接失败');
        }
      } catch (error) {
        resultDiv.style.background = 'rgba(220,38,38,0.15)';
        resultDiv.innerHTML = '❌ 测试失败: ' + error.message;
      }
    }
    window.testNiceAIGCConnection = testNiceAIGCConnection;
    
    function saveNiceAIGCConfig() {
      var enabled = document.getElementById('niceaigcEnabled').checked;
      var chatUrl = document.getElementById('niceaigcUrl').value.trim();
      
      // 保留现有的 useForChat 状态
      var currentConfig = JSON.parse(localStorage.getItem(NICEAIGC_KEY) || '{}');
      
      niceAIGCConfig = {
        enabled: enabled,
        chatUrl: chatUrl || 'https://niceaigc.com/chat',
        useForChat: currentConfig.useForChat || false
      };
      
      localStorage.setItem(NICEAIGC_KEY, JSON.stringify(niceAIGCConfig));
      updateNiceAIGCButton();
      closeModal();
      appendMessage('[系统] NiceAIGC 配置已' + (enabled ? '启用' : '禁用'), 'bot', false);
    }
    window.saveNiceAIGCConfig = saveNiceAIGCConfig;
    function useNiceAIGCForChat() {
      niceAIGCConfig.useForChat = true;
      localStorage.setItem(NICEAIGC_KEY, JSON.stringify(niceAIGCConfig));
      closeModal();
      appendMessage('[系统] 已切换到 NiceAIGC 模式，后续对话将通过 NiceAIGC 处理', 'bot', false);
      
      var btn = document.querySelector('.niceaigc-btn');
      if (btn) {
        btn.style.background = 'linear-gradient(135deg, #00d9a5 0%, #00a382 100%)';
        btn.textContent = '🔄 使用 NiceAIGC 中';
      }
    }
    window.useNiceAIGCForChat = useNiceAIGCForChat;
  </script>
