name: Build macOS App

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-macos:
    name: Build macOS dmg and zip
    runs-on: macos-14
    timeout-minutes: 90

    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build macOS installers
        run: |
          set -o pipefail
          npm run electron:build:mac 2>&1 | tee macos-build.log

      - name: Print build log tail
        if: failure()
        run: |
          echo "Last 200 lines from macos-build.log"
          tail -n 200 macos-build.log || true

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: scholar-harness-macos-${{ github.run_number }}
          path: |
            dist-electron/*.dmg
            dist-electron/*.zip
            dist-electron/*.blockmap
            dist-electron/builder-effective-config.yaml
          if-no-files-found: error
          retention-days: 14

      - name: Upload macOS build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scholar-harness-macos-build-log-${{ github.run_number }}
          path: macos-build.log
          if-no-files-found: warn
          retention-days: 14
