name: Build macOS App

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS dmg and zip
    runs-on: macos-14
    timeout-minutes: 90

    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build macOS installers
        run: |
          set -o pipefail
          npm run electron:build:mac 2>&1 | tee macos-build.log

      - name: Print build log tail
        if: failure()
        run: |
          echo "Last 200 lines from macos-build.log"
          tail -n 200 macos-build.log || true

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: scholar-harness-macos-${{ github.run_number }}
          path: |
            dist-electron/*.dmg
            dist-electron/*.zip
            dist-electron/*.blockmap
            dist-electron/builder-effective-config.yaml
          if-no-files-found: error
          retention-days: 14

      - name: Upload macOS build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scholar-harness-macos-build-log-${{ github.run_number }}
          path: macos-build.log
          if-no-files-found: warn
          retention-days: 14

      - name: Publish failure log branch
        if: failure()
        run: |
          if [ ! -f macos-build.log ]; then
            echo "macos-build.log was not created"
            exit 0
          fi
          cp macos-build.log /tmp/macos-build.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan ci/macos-build-log
          git rm -rf .
          mkdir -p ci-logs
          cp /tmp/macos-build.log ci-logs/macos-build.log
          git add ci-logs/macos-build.log
          git commit -m "Capture macOS build failure log"
          git push --force origin ci/macos-build-log
