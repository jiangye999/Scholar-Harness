name: Build macOS App

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS ${{ matrix.arch }} DMG
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
            builder_flag: --arm64
          - arch: x64
            runner: macos-15-intel
            builder_flag: --x64

    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare macOS application
        run: |
          set -o pipefail
          ulimit -n 65536 || true
          ulimit -n
          : > macos-build.log
          npm run electron:prepare 2>&1 | tee -a macos-build.log
          npm run build 2>&1 | tee -a macos-build.log
          npx tsc -p electron/tsconfig.json 2>&1 | tee -a macos-build.log
          node scripts/build-copy.js 2>&1 | tee -a macos-build.log
          npm run build:bytecode 2>&1 | tee -a macos-build.log
          node scripts/prepare-mac-icon.js 2>&1 | tee -a macos-build.log
          node scripts/write-mac-electron-builder-config.js 2>&1 | tee -a macos-build.log

      - name: Build macOS ${{ matrix.arch }} installer
        run: |
          set -o pipefail
          npx electron-builder \
            --config dist/electron-builder-mac.json \
            --mac dmg \
            ${{ matrix.builder_flag }} \
            --publish never 2>&1 | tee -a macos-build.log

      - name: Print build log tail
        if: failure()
        run: |
          echo "Last 200 lines from macos-build.log"
          tail -n 200 macos-build.log || true

      - name: Verify macOS ${{ matrix.arch }} artifact
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p \"require('./package.json').version\")"
          expected="dist-electron/scholar-harness-${version}-${{ matrix.arch }}.dmg"

          if [[ ! -s "$expected" ]]; then
            shopt -s nullglob
            dmg_files=(dist-electron/*.dmg)
            if [[ "${#dmg_files[@]}" -ne 1 ]]; then
              echo "Expected exactly one DMG, found ${#dmg_files[@]}" >&2
              printf '  %s\n' "${dmg_files[@]:-<none>}" >&2
              exit 1
            fi

            source_dmg="${dmg_files[0]}"
            source_blockmap="${source_dmg}.blockmap"
            mv "$source_dmg" "$expected"
            if [[ -s "$source_blockmap" ]]; then
              mv "$source_blockmap" "${expected}.blockmap"
            fi
          fi

          test -s "$expected"
          ls -lh dist-electron

      - name: Upload macOS ${{ matrix.arch }} installer
        uses: actions/upload-artifact@v4
        with:
          name: scholar-harness-macos-installer-${{ matrix.arch }}-${{ github.run_number }}
          path: |
            dist-electron/*-${{ matrix.arch }}.dmg
            dist-electron/*-${{ matrix.arch }}.dmg.blockmap
          if-no-files-found: error
          retention-days: 14

      - name: Upload macOS build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scholar-harness-macos-${{ matrix.arch }}-build-log-${{ github.run_number }}
          path: macos-build.log
          if-no-files-found: warn
          retention-days: 14

  publish-macos:
    name: Publish macOS installers
    needs: build-macos
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read release version
        id: release-version
        shell: bash
        run: echo "version=$(node -p \"require('./package.json').version\")" >> "$GITHUB_OUTPUT"

      - name: Download macOS installers
        uses: actions/download-artifact@v4
        with:
          pattern: scholar-harness-macos-installer-*-${{ github.run_number }}
          path: release-assets
          merge-multiple: true

      - name: Verify installers and create checksums
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.release-version.outputs.version }}"
          test -s "release-assets/scholar-harness-${version}-x64.dmg"
          test -s "release-assets/scholar-harness-${version}-arm64.dmg"
          sha256sum \
            "release-assets/scholar-harness-${version}-x64.dmg" \
            "release-assets/scholar-harness-${version}-arm64.dmg" \
            > release-assets/SHA256SUMS-macos.txt
          cat release-assets/SHA256SUMS-macos.txt

      - name: Publish macOS installers to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.release-version.outputs.version }}
          name: Scholar Harness v${{ steps.release-version.outputs.version }}
          body: |
            Scholar Harness ${{ steps.release-version.outputs.version }} macOS 安装包。

            - `arm64`：Apple Silicon（M1/M2/M3/M4）
            - `x64`：Intel Mac
            - `SHA256SUMS-macos.txt`：安装包完整性校验

            当前 macOS 构建未进行 Apple Developer ID 签名和公证，首次打开时可能需要在“系统设置 → 隐私与安全性”中确认。
          files: |
            release-assets/scholar-harness-${{ steps.release-version.outputs.version }}-arm64.dmg
            release-assets/scholar-harness-${{ steps.release-version.outputs.version }}-arm64.dmg.blockmap
            release-assets/scholar-harness-${{ steps.release-version.outputs.version }}-x64.dmg
            release-assets/scholar-harness-${{ steps.release-version.outputs.version }}-x64.dmg.blockmap
            release-assets/SHA256SUMS-macos.txt
          fail_on_unmatched_files: false
          overwrite_files: true
          make_latest: true
