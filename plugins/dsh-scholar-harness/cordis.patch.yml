# dsh-scholar-harness bundle patch: inserts the dual-face plugin row into the
# web profile roster. Applied as a profile bundle layer (the `dsh.bundle.patch`
# manifest field) over dsh-base; activate with
# `dsh plugin --profile web add link:<abs path to this package>`.
#
# The row is a bare plugin by package name: the node half (exports ".") runs
# in the host process (Scholar Harness HTTP engine, /api/dsh-scholar routes,
# scholar_* agent tools), and the `dsh.client` declaration in package.json
# makes the browser half (exports "./client") load in the web GUI.
- insert:
    - id: scholar-harness
      name: 'dsh-scholar-harness'
